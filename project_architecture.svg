<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
      .component { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .description { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: #333; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .data-flow { stroke: #0066cc; stroke-width: 2; fill: none; marker-end: url(#arrowhead-blue); stroke-dasharray: 5,5; }
      .control-flow { stroke: #cc0000; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Title -->
  <text x="600" y="30" class="title">🚁 DRONE FIRE DETECTION - PROJECT ARCHITECTURE</text>
  
  <!-- MAIN ENTRY POINT -->
  <rect x="50" y="60" width="150" height="80" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="10"/>
  <text x="125" y="85" class="component" fill="white">main.py</text>
  <text x="125" y="100" class="description" fill="white">Entry point</text>
  <text x="125" y="115" class="description" fill="white">Train/Demo/Validate</text>
  <text x="125" y="130" class="description" fill="white">PPO Trainer</text>
  
  <!-- GYM ENVIRONMENT -->
  <rect x="300" y="60" width="200" height="100" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10"/>
  <text x="400" y="85" class="component" fill="white">wildfire_gym_wrapper.py</text>
  <text x="400" y="100" class="description" fill="white">Gym Environment</text>
  <text x="400" y="115" class="description" fill="white">Reward System</text>
  <text x="400" y="130" class="description" fill="white">Action → Simulation</text>
  <text x="400" y="145" class="description" fill="white">Observation Processing</text>
  
  <!-- NEURAL NETWORK -->
  <rect x="50" y="200" width="150" height="80" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="10"/>
  <text x="125" y="225" class="component" fill="white">wildfire_models.py</text>
  <text x="125" y="240" class="description" fill="white">QuadActor NN</text>
  <text x="125" y="255" class="description" fill="white">CNN + LSTM</text>
  <text x="125" y="270" class="description" fill="white">Action Generation</text>
  
  <!-- OBSERVATION PROCESSOR -->
  <rect x="300" y="200" width="200" height="100" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="10"/>
  <text x="400" y="225" class="component" fill="white">wildfire_obs_processor.py</text>
  <text x="400" y="240" class="description" fill="white">Observation Processing</text>
  <text x="400" y="255" class="description" fill="white">30x30m Vision Window</text>
  <text x="400" y="270" class="description" fill="white">16-feature Self State</text>
  <text x="400" y="285" class="description" fill="white">Boundary Awareness</text>
  
  <!-- SIMULATION CORE -->
  <rect x="600" y="60" width="180" height="120" fill="#27ae60" stroke="#229954" stroke-width="2" rx="10"/>
  <text x="690" y="90" class="component" fill="white">simulation.py</text>
  <text x="690" y="105" class="description" fill="white">PyBullet Physics</text>
  <text x="690" y="120" class="description" fill="white">Drone Management</text>
  <text x="690" y="135" class="description" fill="white">Environment Integration</text>
  <text x="690" y="150" class="description" fill="white">Step Simulation</text>
  <text x="690" y="165" class="description" fill="white">240Hz Physics</text>
  
  <!-- ENVIRONMENT -->
  <rect x="850" y="60" width="160" height="100" fill="#16a085" stroke="#138d75" stroke-width="2" rx="10"/>
  <text x="930" y="85" class="component" fill="white">environment.py</text>
  <text x="930" y="100" class="description" fill="white">World Environment</text>
  <text x="930" y="115" class="description" fill="white">Map Bounds ±50m</text>
  <text x="930" y="130" class="description" fill="white">Weather System</text>
  <text x="930" y="145" class="description" fill="white">Fire Management</text>
  
  <!-- FIRE SIMULATION -->
  <rect x="850" y="200" width="160" height="80" fill="#e67e22" stroke="#d35400" stroke-width="2" rx="10"/>
  <text x="930" y="225" class="component" fill="white">fire_grid.py</text>
  <text x="930" y="240" class="description" fill="white">Fire Spread Simulation</text>
  <text x="930" y="255" class="description" fill="white">5x5m Cells</text>
  <text x="930" y="270" class="description" fill="white">Wind Effects</text>
  
  <!-- DRONES -->
  <rect x="600" y="220" width="180" height="100" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="690" y="245" class="component" fill="white">drones/</text>
  <text x="690" y="260" class="description" fill="white">quadcopter.py</text>
  <text x="690" y="275" class="description" fill="white">fixedwing.py</text>
  <text x="690" y="290" class="description" fill="white">Physics Control</text>
  <text x="690" y="305" class="description" fill="white">4-DOF Actions</text>
  
  <!-- STORAGE -->
  <rect x="50" y="350" width="120" height="80" fill="#7f8c8d" stroke="#6c757d" stroke-width="2" rx="10"/>
  <text x="110" y="375" class="component" fill="white">models/</text>
  <text x="110" y="390" class="description" fill="white">Saved Models</text>
  <text x="110" y="405" class="description" fill="white">Checkpoints</text>
  <text x="110" y="420" class="description" fill="white">newest/</text>
  
  <!-- OUTPUT -->
  <rect x="200" y="350" width="120" height="80" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" rx="10"/>
  <text x="260" y="375" class="component" fill="white">output/</text>
  <text x="260" y="390" class="description" fill="white">Demo Frames</text>
  <text x="260" y="405" class="description" fill="white">Visualizations</text>
  <text x="260" y="420" class="description" fill="white">Logs</text>
  
  <!-- CONNECTIONS -->
  
  <!-- Main to Gym Environment -->
  <line x1="200" y1="100" x2="300" y2="110" class="control-flow"/>
  <text x="250" y="100" class="description">train/demo</text>
  
  <!-- Main to Models -->
  <line x1="125" y1="140" x2="125" y2="200" class="control-flow"/>
  <text x="85" y="170" class="description">loads</text>
  
  <!-- Gym to Observation Processor -->
  <line x1="400" y1="160" x2="400" y2="200" class="data-flow"/>
  <text x="350" y="180" class="description">fetch obs</text>
  
  <!-- Gym to Simulation -->
  <line x1="500" y1="110" x2="600" y2="120" class="control-flow"/>
  <text x="550" y="110" class="description">actions</text>
  
  <!-- Simulation to Environment -->
  <line x1="780" y1="120" x2="850" y2="110" class="arrow"/>
  <text x="815" y="110" class="description">integrates</text>
  
  <!-- Environment to Fire -->
  <line x1="930" y1="160" x2="930" y2="200" class="arrow"/>
  <text x="880" y="180" class="description">manages</text>
  
  <!-- Simulation to Drones -->
  <line x1="690" y1="180" x2="690" y2="220" class="arrow"/>
  <text x="650" y="200" class="description">controls</text>
  
  <!-- Observation Processor to Simulation (data flow) -->
  <line x1="500" y1="240" x2="600" y2="200" class="data-flow"/>
  <text x="550" y="220" class="description">reads state</text>
  
  <!-- Models to Storage -->
  <line x1="110" y1="280" x2="110" y2="350" class="data-flow"/>
  <text x="70" y="315" class="description">saves</text>
  
  <!-- Main to Output -->
  <line x1="200" y1="120" x2="260" y2="350" class="data-flow"/>
  <text x="220" y="235" class="description">generates</text>
  
  <!-- REWARD SYSTEM DETAIL -->
  <rect x="50" y="500" width="1100" height="350" fill="#ffffff" stroke="#333" stroke-width="2" rx="15"/>
  <text x="600" y="530" class="title">🏆 REWARD SYSTEM ARCHITECTURE</text>
  
  <!-- Fire Discovery -->
  <rect x="80" y="560" width="140" height="80" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="8"/>
  <text x="150" y="585" class="component" fill="white">Fire Discovery</text>
  <text x="150" y="600" class="description" fill="white">+50 one-time bonus</text>
  <text x="150" y="615" class="description" fill="white">Vision 30x30m</text>
  <text x="150" y="630" class="description" fill="white">Fire at (0,0)</text>
  
  <!-- Fire Tracking -->
  <rect x="250" y="560" width="140" height="80" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="8"/>
  <text x="320" y="585" class="component" fill="white">Fire Tracking</text>
  <text x="320" y="600" class="description" fill="white">0-42m: 15→0 linear</text>
  <text x="320" y="615" class="description" fill="white">Distance-based</text>
  <text x="320" y="630" class="description" fill="white">Continuous reward</text>
  
  <!-- Stop Bonus -->
  <rect x="420" y="560" width="140" height="80" fill="#27ae60" stroke="#229954" stroke-width="2" rx="8"/>
  <text x="490" y="585" class="component" fill="white">MEGA Stop Bonus</text>
  <text x="490" y="600" class="description" fill="white">+100 hovering</text>
  <text x="490" y="615" class="description" fill="white">&lt;20m + small actions</text>
  <text x="490" y="630" class="description" fill="white">Anti-movement</text>
  
  <!-- Boundary System -->
  <rect x="590" y="560" width="140" height="80" fill="#8e44ad" stroke="#7d3c98" stroke-width="2" rx="8"/>
  <text x="660" y="585" class="component" fill="white">Boundary System</text>
  <text x="660" y="600" class="description" fill="white">42-50m: -5 warning</text>
  <text x="660" y="615" class="description" fill="white">50m+: -25 violation</text>
  <text x="660" y="630" class="description" fill="white">Progressive penalty</text>
  
  <!-- Return Home -->
  <rect x="760" y="560" width="140" height="80" fill="#16a085" stroke="#138d75" stroke-width="2" rx="8"/>
  <text x="830" y="585" class="component" fill="white">Return Home</text>
  <text x="830" y="600" class="description" fill="white">+2×distance bonus</text>
  <text x="830" y="615" class="description" fill="white">When returning</text>
  <text x="830" y="630" class="description" fill="white">from &gt;30m</text>
  
  <!-- Exploration -->
  <rect x="930" y="560" width="140" height="80" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="8"/>
  <text x="1000" y="585" class="component" fill="white">Exploration</text>
  <text x="1000" y="600" class="description" fill="white">+0.5 new cells</text>
  <text x="1000" y="615" class="description" fill="white">2m grid resolution</text>
  <text x="1000" y="630" class="description" fill="white">Before fire found</text>
  
  <!-- Reward Flow -->
  <rect x="200" y="680" width="800" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
  <text x="600" y="705" class="component">TOTAL REWARD = Fire_Tracking + MEGA_Stop_Bonus + Hovering + Boundary + Return + Exploration</text>
  <text x="600" y="725" class="description">🎯 Goal: Stay near fire with small actions = Maximum reward (~145 points/step)</text>
  
  <!-- Problem Areas -->
  <rect x="200" y="760" width="800" height="60" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="10"/>
  <text x="600" y="785" class="component">⚠️ CURRENT PROBLEM</text>
  <text x="600" y="805" class="description">Model still flies away despite massive stop bonuses - behavioral momentum stronger than reward system</text>
  
  <!-- Legend -->
  <rect x="50" y="870" width="500" height="20" fill="#f8f9fa"/>
  <line x1="60" y1="880" x2="100" y2="880" class="control-flow"/>
  <text x="110" y="885" class="description">Control Flow</text>
  <line x1="200" y1="880" x2="240" y2="880" class="data-flow"/>
  <text x="250" y="885" class="description">Data Flow</text>
  <line x1="340" y1="880" x2="380" y2="880" class="arrow"/>
  <text x="390" y="885" class="description">Integration</text>
  
</svg>